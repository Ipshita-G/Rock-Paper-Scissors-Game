<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock-Paper-Scissors</h1>

        <div class="battle-arena">

            <div class="player-side side">
                <div class="player-info">
                    <h2>YOU</h2>
                    <div id="playerDisplay" class="choice-display">—</div>
                    <div id="playerScore" class="score">Score: 0</div>
                </div>
            </div>

            <div class="battle-center">
                <div id="resultDisplay" class="result-text">Choose your weapon</div>
                <div class="vs-area">
                    <span class="vs">VS</span>
                </div>
            </div>

            <div class="computer-side side">
                <div class="computer-info">
                    <h2>COMPUTER</h2>
                    <div id="computerDisplay" class="choice-display">—</div>
                    <div id="computerScore" class="score">Score: 0</div>
                </div>
            </div>
        </div>

        <div class="choices">
            <button onclick="playGame('rock')">🪨</button>
            <button onclick="playGame('paper')">📄</button>
            <button onclick="playGame('scissors')">✂️</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
